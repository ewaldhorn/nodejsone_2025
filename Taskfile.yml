# https://taskfile.dev

version: "3"

vars:
  UI_DIR: ui
  UI_INCLUDE_FILE: ui/dist/index.html

tasks:
  default:
    cmds:
      - task --list-all
    silent: true
  buildui:
    desc: "Builds the UI HTML file"
    dir: "{{.UI_DIR}}"
    cmds:
      - npm run build
    silent: true
  run:
    desc: "Runs the desktop application, first builds the UI file"
    cmds:
      - task buildui
      - go run ./...
    silent: false
  runhelp:
    desc: "Runs the desktop application with a '-help' flag"
    cmds:
      - go run ./... -help
    silent: true
  runversion:
    desc: "Runs the desktop application with a '-version' flag"
    cmds:
      - go run ./... -version
    silent: true
